name = "claudix"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Сайт (папка public) раздаётся как статика, а всё на /api/* обрабатывает Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# База аккаунтов и сохранений. Вставь сюда Database ID из Cloudflare (Storage & Databases -> D1 -> claudix-db).
[[d1_databases]]
binding = "DB"
database_name = "claudix-db"
database_id = "ee60de13-17c9-4dcf-b68e-483dc9121fbf"
