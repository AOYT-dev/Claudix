It all started with a hangar on the edge of the city.

A rusty roof, a concrete floor, three desks, one old generator, and a twenty-six-year-old engineer named Edward Sterling. He had no money and no connections. All he had was an idea and a habit of speaking very quietly, so quietly that everyone around him went silent to hear.

He hired his first employee through an ad. He lured the second away from a university that paid him peanuts. The three of them slept in the hangar, ate instant noodles and argued over blueprints until they were hoarse.

“What do we call the company?” the second employee asked one day. “It needs to be something loud. Something people remember.”

Sterling shook his head.

“People forget loud things fast. The most important things are done in the shade.”

That's how the company got its name.

The first contract was small: a light alloy for the protective shields of the city's rescue workers. The alloy stopped bullets and weighed as much as plastic. A year later, Shade was making shields for half the country. Three years later: armor, batteries, engines and medicine. Five years later, the hangar was torn down, and in its place rose a tower of black glass, so tall that on cloudy days its top floors disappeared into the clouds.

The fall didn't end.

Neil didn't know how long it lasted. A second. A year. Maybe a thousand years. Time inside had become thick, like tar, and it tore into pieces. He saw his hand, and the hand stretched out for kilometers, then shrank into a dot.

Then came the pain.

Not like a burn or a broken bone. The pain was everywhere at once, as if he were being taken apart, every cell, every thought, every memory, and put back together in a different order. He screamed, but there was no scream. There was nothing here. Not even darkness. Darkness is at least something, and here there was an emptiness where even the word "emptiness" disappeared.

And then the emptiness looked at him.

Neil was never able to explain what it was. Not eyes, not a face, not a voice. Just the feeling of being looked at from the inside. That the emptiness had noticed him. Studied him. And decided not to let him go, but to keep him for itself.

It went into him. Or he went into it. There was no difference anymore.

When Neil opened his eyes, there were stars around him again.

He was hanging in open space. His spacesuit was gone. No helmet, no gloves, no boots: the black hole had taken everything that wasn't him. He should have died in seconds, from the cold, from the vacuum, from having nothing to breathe. But he didn't die. He didn't need a spacesuit anymore. He wasn't breathing at all. And he wasn't cold.

Neil raised his hands to his face and didn't recognize them.

His skin had turned dark and gray, like ash after a campfire. Thin cracks ran across it, and light seeped from the cracks: pale, violet, like the glow of that ring of stars. He ran his fingers over his face and felt bare bone where his cheeks and lips had been. His lower jaw stuck out like a skull's.

He wanted to scream. The sound that came out of his mouth was like wind howling through an empty pipe.

The black hole hung behind him, far away, many thousands of kilometers off. Neil didn't remember how he had gotten so far away. As if it had swallowed him, chewed him up and spat him back out. Only different.

Nearby, the wreckage of the Horizon slowly drifted.

Neil flew among the pieces. He suddenly realized he could move just by wanting to, and the emptiness itself carried him forward. A piece of hull plating with the ship's number. An open locker. Ben's guitar with broken strings. Pages covered in Oscar's tiny handwriting.

He found all of them. All seven.

Neil hung beside them for a long time and couldn't move. Then he gathered them together, covered them with what was left of the big solar sail, and let them go. Slowly, gently. The way you push a boat out to sea.

“I'm sorry,” he said in a hollow, unfamiliar voice. “I should have brought you back.”

Then he saw a jagged piece of debris flying straight at him and threw up his hand to shield himself.

A dark clot burst out of his palm: a black core in a violet halo. It punched right through the debris like paper and kept going, off into the black.

Neil stared at his hand. Then he slowly raised both hands and concentrated.

Space crackled between his palms. Sparks and dark rays pulled together into one point, and a small black vortex flared. The debris around him trembled and crept toward it, faster and faster, spiraling, until the vortex sucked it in and ground it to dust. Then it collapsed with a flash.

The emptiness was inside him now. And it obeyed.

Neil looked toward a spot where, among millions of stars, one burned a little brighter than the rest. A bluish dot. Earth.

He didn't know what was waiting for him there. He didn't know what he had become or whether they would take him back. He knew only one thing: he had to go home.

And he flew.

The trip home took almost a year.

{ t: "The Hunter in the Shadows", x: `
For the first few weeks, the invisibility came on its own. Without asking.

That night, a shooting star crossed the sky over the city.

At dawn, a man walked out of the water onto the empty beach.

Or rather, something that looked like a man. Average height, average build, only with ash-colored skin crossed by cracks of violet light. Instead of the lower half of his face, bare bone.

A jogger in earbuds saw him from the other end of the beach, stopped, then turned around and ran faster than he had ever run in his life.

Neil watched him go. Then he bent over a puddle left by the tide and, for the first time, saw his whole face.

He stood over that puddle for a long time.

During the day he hid in an abandoned warehouse by the old pier. Through the cracks in the walls came the noise of the city: cars, voices, music from a café. A year ago he had dreamed of hearing all of it again. Now every sound cut like glass.

In the evening, a screen lit up on the wall of the bar across the street. The news was on. Neil moved closer to a crack.

On the screen was the square in front of the black tower. On the wall of the tower, a memorial plaque with eight names. His name was there too. Next to Lily, Tara, Oscar…

"A year ago, the crew of the Horizon was killed in a collision with a meteorite," the anchor was saying. "Today, the Shade corporation opened a science center in their honor…"

A meteorite.

Neil remembered the crack running along the nose of the ship. The thin sound Oscar's knuckles made on the wall every morning. “I told you about the nose…”

There had been no meteorite.

He waited for dark. But he didn't go to the tower right away.

First he went up to his home. Not by the stairs, but up the wall, to the sixth floor, to the window of his old apartment. The apartment was dark and empty. Apparently Shade had never found anyone to give it to.

On the windowsill, next to the dried-up flowers, sat a little blue whale with an embroidered smile. Waiting. For almost two years.

Neil looked at it through the glass for a long time. Let it wait for us at home, he had said back then. Us.

He didn't open the window. A monster with ash-gray skin had no business in this apartment.

“Wait a little longer,” he said quietly.

And he went to the tower.

The city was different at night. Neil moved along rooftops and alleys, and the emptiness carried him over the streets the way the wind carries ash. Below, windows were lit, cars drove by, people laughed on patios. No one looked up.

{ t: "Each to His Own Side", x: `
The underground levels of Shade's tower folded one onto another like cardboard boxes.

{ t: "The Multiverse", x: `

{ t: "The Second Battle", x: `
