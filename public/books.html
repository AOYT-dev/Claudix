<style>

var R = { id: null, pages: 1, page: 0, W: 0, GAP: 64, paraPage: [], chPage: [], anim: null, drag: null, spread: false };
var reader = $("reader"), stage = $("stage"), leaf = $("leaf");
function pgObj(id) { var el = $(id); return { el: el, flow: el.querySelector(".flow"), hd: el.querySelector(".hd"), pn: el.querySelector(".pn"), shade: el.querySelector(".shade"), gloss: el.querySelector(".gloss") }; }
var PG = { uL: pgObj("uL"), uR: pgObj("uR"), lF: pgObj("lF"), lB: pgObj("lB") };
var FLOWS = [PG.uL.flow, PG.uR.flow, PG.lF.flow, PG.lB.flow];

function bookHTML(id) {
  var b = BYID[id], chs = BOOK_TEXTS[id], h = [], pi = 0, num = 0;
  h.push('<section class="tp"><h1>' + esc(b.title) + '</h1><img alt="" src="' + coverURL(b) + '"><div class="ann">' + (b.ann || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") + '</div><div class="c">' + esc(b.sub || "") + " · 16+<br>Сюжет: AOYT · Claudix Книги</div></section>");
  chs.forEach(function (c, ci) {
    if (!c.post) num++;
    h.push('<h2 data-ch="' + ci + '"' + (c.post ? ' class="post"' : "") + '><span class="gl">' + (b.dossier ? "Досье" : c.post ? "Бонус" : "Глава " + num) + '</span><span class="gt">' + esc(c.t) + "</span></h2>");
    c.x.trim().split(/\n\s*\n/).forEach(function (p) { h.push('<p data-i="' + (pi++) + '">' + esc(p.trim()) + "</p>"); });
  });
  h.push('<section class="end" data-end="1"><b>КОНЕЦ</b><span>' + esc(b.title) + (b.next && BYID[b.next] ? "<br>Дальше: «" + esc(BYID[b.next].title) + "»" : "") + "</span></section>");
  return h.join("");
}
function applySettings() {
  reader.setAttribute("data-rt", S.set.theme); reader.setAttribute("data-font", S.set.font);
  reader.style.setProperty("--rsize", S.set.size + "px");
  reader.style.setProperty("--rlh", S.set.lh === "loose" ? "1.55" : "1.32");
  Array.prototype.forEach.call(document.querySelectorAll("#themes button"), function (b) { b.classList.toggle("on", b.getAttribute("data-rt") === S.set.theme); });
  Array.prototype.forEach.call(document.querySelectorAll("#fonts button"), function (b) { b.classList.toggle("on", b.getAttribute("data-f") === S.set.font); });
  Array.prototype.forEach.call(document.querySelectorAll("#lhSeg button"), function (b) { b.classList.toggle("on", b.getAttribute("data-lh") === S.set.lh); });
}
function pageOfEl(el) { return Math.floor((el.offsetLeft + 2) / (R.W + R.GAP)); }
function layout() {
  R.spread = reader.clientWidth >= 860 && reader.clientHeight >= 520;
  reader.classList.toggle("spread", R.spread); reader.classList.toggle("single", !R.spread);
  var sw = stage.clientWidth;
  var pw = R.spread ? sw / 2 : sw;
  var px = R.spread ? Math.round(clamp(pw * 0.05, 22, 44)) : Math.round(clamp(pw * 0.045, 16, 36));
  stage.style.setProperty("--px", px + "px");
  var W = PG.uR.el.querySelector(".pb").clientWidth; R.W = W;
  FLOWS.forEach(function (f) { f.style.width = W + "px"; f.style.columnWidth = W + "px"; f.style.columnGap = R.GAP + "px"; f.style.columnCount = "auto"; });
  var fl = PG.uR.flow, end = fl.querySelector("[data-end]");
  R.pages = Math.max(1, pageOfEl(end) + 1);
  R.paraPage = []; Array.prototype.forEach.call(fl.querySelectorAll("p[data-i]"), function (p) { R.paraPage[+p.getAttribute("data-i")] = pageOfEl(p); });
  R.chPage = []; Array.prototype.forEach.call(fl.querySelectorAll("h2[data-ch]"), function (hh) { R.chPage[+hh.getAttribute("data-ch")] = pageOfEl(hh); });
  $("rScrub").max = R.pages - 1; $("rScrub").step = R.spread ? 2 : 1;
}
function anchorFor(page) { var best = -1; for (var i = 0; i < R.paraPage.length; i++) { if (R.paraPage[i] === page) return i; if (R.paraPage[i] < page) best = i; } return best; }
function pageForAnchor(a) { if (a == null || a < 0) return 0; return clamp(R.paraPage[a] !== undefined ? R.paraPage[a] : 0, 0, R.pages - 1); }
function chapterAt(page) { var c = 0; for (var i = 0; i < R.chPage.length; i++) if (R.chPage[i] <= page) c = i; return c; }
function normPage(p) { p = clamp(p, 0, R.pages - 1); if (R.spread) p -= p % 2; return p; }
function step() { return R.spread ? 2 : 1; }
function headerFor(p) {
  if (p <= 0 || p >= R.pages - 1 || R.chPage.indexOf(p) >= 0) return "";
  if (R.spread && p % 2 === 0) return BYID[R.id].title;
  var c = BOOK_TEXTS[R.id][chapterAt(p)]; return c ? c.t : "";
}
function setPage(P, p) {
  var ok = p >= 0 && p < R.pages;
  P.flow.style.visibility = ok ? "" : "hidden";
  if (ok) P.flow.style.transform = "translate3d(" + (-p * (R.W + R.GAP)) + "px,0,0)";
  P.hd.textContent = ok ? headerFor(p) : "";
  P.pn.textContent = ok && p > 0 && p < R.pages - 1 ? String(p + 1) : "";
}
function setAngle(a) {
  var k = a / 180, s = Math.sin(Math.PI * k);
  leaf.style.transform = a ? "rotateY(" + (-a) + "deg)" : "";
  PG.uR.shade.style.opacity = (0.8 * s * (1 - 0.6 * k)).toFixed(3);
  PG.uL.shade.style.opacity = R.spread ? (0.7 * s * k).toFixed(3) : "0";
  PG.lF.gloss.style.opacity = (0.9 * s).toFixed(3); PG.lB.gloss.style.opacity = (0.5 * s).toFixed(3);
}
function idle() {
  leaf.style.visibility = "hidden"; setAngle(0);
  if (R.spread) { setPage(PG.uL, R.page); setPage(PG.uR, R.page + 1); } else setPage(PG.uR, R.page);
  updateInfo();
}
function canFwd() { return R.page + step() <= R.pages - 1; }
function canBack() { return R.page > 0; }
function prepFwd() { var p = R.page; if (R.spread) { setPage(PG.uL, p); setPage(PG.uR, p + 3); setPage(PG.lF, p + 1); setPage(PG.lB, p + 2); } else { setPage(PG.uR, p + 1); setPage(PG.lF, p); } leaf.style.visibility = "visible"; }
function prepBack() { var p = R.page; if (R.spread) { setPage(PG.uL, p - 2); setPage(PG.uR, p + 1); setPage(PG.lF, p - 1); setPage(PG.lB, p); } else { setPage(PG.uR, p); setPage(PG.lF, p - 1); } leaf.style.visibility = "visible"; }
function updateInfo() {
  var b = BYID[R.id], last = !canFwd();
  var rp = R.spread ? Math.min(R.page + 1, R.pages - 1) : R.page;
  var ch = chapterAt(rp), nextCh = R.chPage[ch + 1] !== undefined ? R.chPage[ch + 1] : R.pages - 1, left = nextCh - rp - 1;
  var info = "Стр. " + (R.page + 1) + (R.spread && R.page + 1 < R.pages ? "–" + (R.page + 2) : "") + " из " + R.pages;
  if (rp > 0 && rp < R.pages - 1) info += left > 0 ? " · осталось " + left + " стр. в главе" : " · конец главы";
  $("rInfo").textContent = info; $("rScrub").value = R.page;
  var nb = b.next && BYID[b.next];
  $("rNext").hidden = !(last && nb); if (nb) $("rNext").textContent = "Дальше: " + nb.title + " →";
  if (last && nb) reader.classList.add("chrome");
  S.pos[R.id] = anchorFor(R.page); S.pct[R.id] = R.pages > 1 ? Math.min(100, Math.round((R.page + step() - 1) / (R.pages - 1) * 100)) : 100; S.last = R.id; save();
  var cur = document.querySelector("#tocList li.cur"); if (cur) cur.classList.remove("cur");
  var li = document.querySelector('#tocList li[data-ch="' + ch + '"]'); if (li && rp > 0) li.classList.add("cur");
}
function openBook(id) {
  R.id = id; var b = BYID[id];
  applySettings();
  var html = bookHTML(id); FLOWS.forEach(function (f) { f.innerHTML = html; });
  $("rTitle").textContent = b.title; $("tocTitle").textContent = b.title;
  var tl = $("tocList"); tl.innerHTML = ""; var num = 0;
  BOOK_TEXTS[id].forEach(function (c, ci) { if (!c.post) num++; var li = document.createElement("li"); li.setAttribute("data-ch", ci); li.innerHTML = '<button><span class="n">' + (c.post ? "★" : num) + '</span><span class="t">' + esc(c.t) + '</span><span class="p"></span></button>'; li.querySelector("button").onclick = function () { closePanels(); go(R.chPage[ci] || 0); }; tl.appendChild(li); });
  $("lib").setAttribute("aria-hidden", "true"); reader.hidden = false; document.documentElement.style.overflow = "hidden";
  reader.classList.add("chrome");
  relayout(S.pos[id]);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (R.id === id) relayout(); });
  setTimeout(function () { if (R.id === id && canFwd()) reader.classList.remove("chrome"); }, 1800);
}
function relayout(anchor) {
  if (!R.id) return;
  finishAnim();
  if (anchor === undefined) anchor = anchorFor(R.page);
  layout(); R.page = normPage(pageForAnchor(anchor));
  Array.prototype.forEach.call(document.querySelectorAll("#tocList li"), function (li) { var ci = +li.getAttribute("data-ch"); li.querySelector(".p").textContent = (R.chPage[ci] || 0) + 1; });
  idle();
}
function closeBook() {
  finishAnim(); R.id = null; reader.hidden = true; closePanels(); $("lib").removeAttribute("aria-hidden"); document.documentElement.style.overflow = "";
  renderLibrary();
}
function go(p) { finishAnim(); R.page = normPage(p); idle(); }

// ---- анимация перелистывания ----
function ease(t) { return 1 - Math.pow(1 - t, 3); }
function tween(a0, a1, done) {
  finishAnim();
  if (REDUCED) { setAngle(a1); done(); return; }
  var dur = 140 + 420 * Math.abs(a1 - a0) / 180, t0 = performance.now(), anim = { done: done, a1: a1, raf: 0 };
  R.anim = anim;
  function stepA(now) { var t = clamp((now - t0) / dur, 0, 1); setAngle(a0 + (a1 - a0) * ease(t)); if (t < 1) anim.raf = requestAnimationFrame(stepA); else { R.anim = null; done(); } }
  anim.raf = requestAnimationFrame(stepA);
}
function finishAnim() { var a = R.anim; if (!a) return; cancelAnimationFrame(a.raf); R.anim = null; setAngle(a.a1); a.done(); }
function next() { finishAnim(); if (!canFwd()) return; prepFwd(); setAngle(0); tween(0, 180, function () { R.page += step(); idle(); }); }
function prev() { finishAnim(); if (!canBack()) return; prepBack(); setAngle(180); tween(180, 0, function () { R.page -= step(); idle(); }); }

// ---- жесты: тап по краям, перетаскивание страницы ----
stage.addEventListener("pointerdown", function (e) {
  if (e.button !== undefined && e.button !== 0) return;
  if (!$("aa").hidden || !$("toc").hidden) { closePanels(); return; }
  finishAnim();
  R.drag = { x0: e.clientX, y0: e.clientY, dir: null, id: e.pointerId, w: stage.clientWidth, last: e.clientX, lt: performance.now(), v: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (er) {}
});
function span(d) { return d.w * (R.spread ? 0.75 : 0.85); }
stage.addEventListener("pointermove", function (e) {
  var d = R.drag; if (!d || e.pointerId !== d.id) return;
  var dx = e.clientX - d.x0, now = performance.now();
  d.v = (e.clientX - d.last) / Math.max(1, now - d.lt); d.last = e.clientX; d.lt = now;
  if (!d.dir) {
    if (Math.abs(dx) < 8) return;
    if (dx < 0 && canFwd()) { d.dir = "f"; prepFwd(); }
    else if (dx > 0 && canBack()) { d.dir = "b"; prepBack(); }
    else { d.dir = "none"; return; }
  }
  if (d.dir === "f") setAngle(clamp(-dx / span(d), 0, 1) * 180);
  if (d.dir === "b") setAngle(180 - clamp(dx / span(d), 0, 1) * 180);
});
function endDrag(e) {
  var d = R.drag; if (!d || e.pointerId !== d.id) return; R.drag = null;
  var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.dir) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 12) {
      var r = stage.getBoundingClientRect(), x = e.clientX - r.left;
      if (x < r.width * 0.25) prev(); else if (x > r.width * 0.75) next(); else reader.classList.toggle("chrome");
    }
    return;
  }
  if (d.dir === "none") return;
  var prog = d.dir === "f" ? clamp(-dx / span(d), 0, 1) : clamp(dx / span(d), 0, 1);
  var fling = d.dir === "f" ? d.v < -0.45 : d.v > 0.45;
  var cur = d.dir === "f" ? prog * 180 : 180 - prog * 180;
  if (prog > 0.33 || fling) {
    if (d.dir === "f") tween(cur, 180, function () { R.page += step(); idle(); }); else tween(cur, 0, function () { R.page -= step(); idle(); });
  } else {
    if (d.dir === "f") tween(cur, 0, idle); else tween(cur, 180, idle);
  }
}
stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", function (e) { if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); if (R.anim) return; if (e.deltaX > 0) next(); else prev(); } }, { passive: false });
addEventListener("keydown", function (e) {
  if (reader.hidden) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Escape") { if (!$("aa").hidden || !$("toc").hidden) closePanels(); else closeBook(); }
});

// ---- панели ----
function closePanels() { $("aa").hidden = true; $("toc").hidden = true; }
$("rBack").onclick = closeBook;
$("rAa").onclick = function (e) { e.stopPropagation(); var h = $("aa").hidden; closePanels(); $("aa").hidden = !h; };
$("rToc").onclick = function (e) { e.stopPropagation(); var h = $("toc").hidden; closePanels(); $("toc").hidden = !h; var cur = document.querySelector("#tocList li.cur"); if (cur) cur.scrollIntoView({ block: "center" }); };
$("tocClose").onclick = closePanels;
$("rScrub").addEventListener("input", function () { go(+this.value); });
$("rNext").onclick = function () { var b = BYID[R.id]; if (b.next) { closePanels(); openBook(b.next); } };
var SIZES = [13, 14, 15, 16, 17, 18, 19, 20, 22, 24, 26, 28];
function bump(d) { var i = SIZES.indexOf(S.set.size); if (i < 0) i = 4; i = clamp(i + d, 0, SIZES.length - 1); S.set.size = SIZES[i]; save(); applySettings(); relayout(); }
$("fsDown").onclick = function () { bump(-1); };
$("fsUp").onclick = function () { bump(1); };
Array.prototype.forEach.call(document.querySelectorAll("#lhSeg button"), function (b) { b.onclick = function () { S.set.lh = b.getAttribute("data-lh"); save(); applySettings(); relayout(); }; });
Array.prototype.forEach.call(document.querySelectorAll("#themes button"), function (b) { b.onclick = function () { S.set.theme = b.getAttribute("data-rt"); save(); applySettings(); }; });
Array.prototype.forEach.call(document.querySelectorAll("#fonts button"), function (b) { b.onclick = function () { S.set.font = b.getAttribute("data-f"); save(); applySettings(); relayout(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { relayout(); }); }; });
var rzT = 0; addEventListener("resize", function () { clearTimeout(rzT); rzT = setTimeout(function () { if (R.id) relayout(); }, 120); });

renderLibrary();
if (window.__TEST__) window.__BK = { R: R, S: S, openBook: openBook, next: next, prev: prev, go: go, closeBook: closeBook, relayout: relayout, bump: bump };
})();
