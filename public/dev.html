<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Окно разработчика</title>
<style>
  :root { color-scheme: dark; --bg: #0c0f14; --card: #151a22; --line: #263040; --txt: #e8eef7; --mut: #8b97a8; --acc: #ffc933; --ok: #5be28a; --bad: #ff6b7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; } p.sub { margin: 0 0 18px; color: var(--mut); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: var(--mut); margin: 12px 0 4px; } label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0c1016; color: var(--txt); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: 1px; }
  button { width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px; background: var(--acc); color: #1b1500; font: 700 1rem system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; } button.ghost { background: transparent; color: var(--mut); border: 1px solid var(--line); margin-top: 8px; }
  #msg { min-height: 1.3em; margin-top: 10px; font-size: .9rem; } .ok { color: var(--ok); } .bad { color: var(--bad); }
  #log { list-style: none; margin: 0; padding: 0; font-size: .85rem; color: var(--mut); } #log li { padding: 6px 0; border-top: 1px solid var(--line); } #log li:first-child { border-top: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Окно разработчика</h1>
  <p class="sub">Claudix · подарки игрокам по нику</p>

  <section class="card" id="gate">
    <label for="key">Код разработчика</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="••••••••">
    <button id="enter" type="button">Войти</button>
    <div id="gmsg" class="bad"></div>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <label for="nick">Ник игрока</label>
      <input id="nick" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="например, Sasha_123">
      <label for="game">Игра</label>
      <select id="game"><option value="liga">Лига Улиц</option><option value="lemon">Лимонный Икс</option><option value="viraj">Вираж-9</option></select>
      <div id="f-kind"><label for="kind">Подарок</label>
      <select id="kind">
        <option value="money">Монеты</option>
        <option value="hero">Герой</option>
        <option value="sp">Скиллпойнты ★</option>
      </select></div>
      <div id="f-money"><label for="amount" id="amountLbl">Сколько монет</label><input id="amount" type="number" min="1" max="10000000" value="5000" inputmode="numeric"></div>
      <div id="f-hero" hidden><label for="hero">Какого героя</label>
        <select id="hero">
          <option value="storm">Шторм-Джей</option><option value="shade">Тень-9</option><option value="graviton">Гравитон</option>
          <option value="flame">Пламень</option><option value="abyss">Бездна</option><option value="virus">Вирус</option>
          <option value="phantom">Фантом</option><option value="titan">Титан</option><option value="chronos">Хронос</option>
        </select></div>
      <div id="f-sp" hidden><label for="spn">Сколько скиллпойнтов</label><input id="spn" type="number" min="1" max="100" value="2" inputmode="numeric"></div>
      <button id="send" type="button">Отправить подарок</button>
      <div id="msg"></div>
    </div>
    <div class="card"><label style="margin:0 0 6px">Отправлено за сессию</label><ul id="log"><li>Пока пусто</li></ul></div>
    <button class="ghost" id="out" type="button">Выйти</button>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "", HEROES = { storm: "Шторм-Джей", shade: "Тень-9", graviton: "Гравитон", flame: "Пламень", abyss: "Бездна", virus: "Вирус", phantom: "Фантом", titan: "Титан", chronos: "Хронос" };
  var ERR = { bad_key: "Неверный код", off: "Окно выключено: на сервере не задан секрет ADMIN_KEY", slow_down: "Слишком много попыток, подожди 10 минут", no_user: "Такого ника нет", bad_name: "Ник написан неправильно", bad_amount: "Слишком большое число", bad_hero: "Такого героя нет", bad_game: "Такой игры нет", empty: "Нечего дарить", busy: "Игрок сейчас сохраняется, попробуй ещё раз" };

  // код живёт только в памяти этой вкладки, никуда не сохраняется
  function call(payload) {
    return fetch("/api/admin/gift", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; }); });
  }
  $("enter").onclick = function () {
    KEY = $("key").value; $("gmsg").textContent = "";
    if (!KEY) return;
    $("enter").disabled = true;
    // пустой запрос: если код верный, сервер ответит «bad_name» (400), а не «bad_key» (401)
    call({}).then(function (r) {
      $("enter").disabled = false;
      if (r.status === 401 || r.status === 404 || r.status === 429) { KEY = ""; $("gmsg").textContent = ERR[r.j.error] || "Не вышло"; return; }
      $("gate").hidden = true; $("panel").hidden = false; $("key").value = "";
    }, function () { $("enter").disabled = false; $("gmsg").textContent = "Нет связи с сервером"; });
  };
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") $("enter").click(); });
  $("out").onclick = function () { KEY = ""; $("panel").hidden = true; $("gate").hidden = false; };
  function layout() {
    var g = $("game").value, k = g === "liga" ? $("kind").value : "money";
    $("f-kind").hidden = g !== "liga"; $("f-money").hidden = k !== "money"; $("f-hero").hidden = k !== "hero"; $("f-sp").hidden = k !== "sp";
    $("amountLbl").textContent = g === "lemon" ? "Сколько лимонов" : "Сколько монет";
  }
  $("kind").onchange = layout; $("game").onchange = layout;

  $("send").onclick = function () {
    var nick = $("nick").value.trim(), game = $("game").value, kind = game === "liga" ? $("kind").value : "money", p = { name: nick, game: game }, what;
    if (!nick) { say("Впиши ник", false); return; }
    if (game !== "liga") { p.amount = Math.floor(+$("amount").value || 0); what = p.amount + (game === "lemon" ? " лимонов" : " монет") + " (" + $("game").selectedOptions[0].text + ")"; }
    else if (kind === "money") { p.money = Math.floor(+$("amount").value || 0); what = p.money + " монет"; }
    else if (kind === "hero") { p.hero = $("hero").value; what = "героя " + HEROES[p.hero]; }
    else { p.sp = Math.floor(+$("spn").value || 0); what = p.sp + " скиллпойнт(ов) ★"; }
    $("send").disabled = true; say("Отправляю…", null);
    call(p).then(function (r) {
      $("send").disabled = false;
      if (r.status === 200 && r.j.ok) {
        say("Готово: " + r.j.name + " получит " + what, true);
        var li = document.createElement("li"); li.textContent = new Date().toLocaleTimeString("ru-RU") + " · " + r.j.name + " ← " + what;
        var log = $("log"); if (log.firstChild && log.firstChild.textContent === "Пока пусто") log.innerHTML = ""; log.insertBefore(li, log.firstChild);
      } else say(ERR[r.j.error] || "Ошибка " + r.status, false);
    }, function () { $("send").disabled = false; say("Нет связи с сервером", false); });
  };
  function say(t, ok) { var m = $("msg"); m.textContent = t; m.className = ok === true ? "ok" : ok === false ? "bad" : ""; }
})();
</script>
</body>
</html>
