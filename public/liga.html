<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лига Улиц</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Onest:wght@400;500;700&display=swap">
<style>
/* без зума от быстрых тапов */
* { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
/* Layout: во весь экран 3D-сцена. Поверх неё либо меню (герой крутится сверху, карточки героев внизу), либо HUD: джойстик слева, кнопки справа. Одна смелая деталь: жёлтый акцент и плакатный шрифт. */
:root {
  --font-display: "Russo One", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #0a1020;
  --panel: rgba(10, 16, 34, 0.86);
  --panel-solid: #121b38;
  --fg: #f1f5ff;
  --muted: #9fb0d4;
  --line: rgba(255, 255, 255, 0.16);
  --accent: #ffc933;
  --on-accent: #171200;
  --hp: #37d67a;
  --danger: #ff4a5c;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  position: relative;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

#stage { position: absolute; inset: 0; z-index: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#pops { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-display);
  font-size: 1rem;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
  white-space: nowrap;
  will-change: transform;
}
#hurt {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  box-shadow: inset 0 0 130px 30px rgba(255, 40, 60, 0.7);
  opacity: 0; transition: opacity 0.3s;
}
#hurt.on { opacity: 1; transition: none; }

.layer {
  position: absolute; inset: 0; z-index: 4;
  padding-left: var(--gutter);
  padding-right: var(--gutter-r);
  pointer-events: none;
}
.layer > * { pointer-events: auto; }

/* ---------- HUD ---------- */
#hud { display: flex; flex-direction: column; padding-block: 10px; }
#hud > .top { pointer-events: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.hpbox { width: min(44vw, 250px); min-width: 0; }
.hname { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.bar { height: 14px; border-radius: 7px; background: rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid var(--line); margin-top: 3px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transform-origin: left; transition: transform 0.12s, background 0.2s; }
.bar i.low { background: var(--danger); }
.hptxt { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.wave { text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.5); min-width: 0; }
.wave b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.wave span { font-size: 0.78rem; color: var(--muted); }
.right { display: flex; align-items: center; gap: 8px; }
.earn { font-family: var(--font-display); font-size: 1.05rem; display: flex; align-items: center; gap: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.coin { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #b98a00; display: inline-block; flex: none; }
.pbtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(0, 0, 0, 0.45);
  font-family: var(--font-display); cursor: pointer;
}
#joyzone { position: absolute; left: 0; top: 64px; bottom: 0; width: 52%; touch-action: none; }
.joybase {
  position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07);
  pointer-events: none;
}
.joyknob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%; background: rgba(255,255,255,.42); border: 2px solid rgba(255,255,255,.7);
}
.btn {
  position: absolute; touch-action: none; border-radius: 50%; overflow: hidden; cursor: pointer;
  border: 3px solid rgba(255,255,255,.55); background: rgba(20, 28, 56, 0.55);
  font-family: var(--font-display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6);
  display: grid; place-items: center; padding: 0; -webkit-tap-highlight-color: transparent;
}
.btn .lbl { position: relative; z-index: 1; font-size: 0.8rem; text-align: center; line-height: 1.05; padding: 0 6px; }
#btnAtk { width: 104px; height: 104px; right: calc(var(--gutter-r) + 4px); bottom: 26px; background: rgba(255, 201, 51, 0.3); border-color: var(--accent); }
#btnAtk .lbl { font-size: 1rem; }
#btnAbil { width: 80px; height: 80px; right: calc(var(--gutter-r) + 122px); bottom: 40px; }
#btnAbil.ready { border-color: #5df0ff; box-shadow: 0 0 18px rgba(93, 240, 255, 0.7); }
.cdfill { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); transform-origin: bottom; transform: scaleY(0); }
.btn:active { filter: brightness(1.25); }

#banner {
  position: absolute; left: 0; right: 0; top: 22%; z-index: 5; text-align: center; pointer-events: none;
  opacity: 0; padding: 0 16px;
}
#banner b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 9vw, 4rem); text-shadow: 0 4px 0 rgba(0,0,0,.55); text-wrap: balance; }
#banner span { display: block; font-size: 1rem; color: var(--accent); margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
#banner.show { animation: ban 2.2s ease forwards; }
@keyframes ban {
  0% { opacity: 0; transform: scale(0.8); }
  14% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-8px); }
}

/* ---------- Меню ---------- */
#menu { display: flex; flex-direction: column; justify-content: space-between; padding-block: 12px; }
#menu > .mtop { pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.back { display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 999px; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); color: #fff; font-size: 0.8rem; font-weight: 700; text-decoration: none; }
.who { margin-left: 8px; font-size: 0.8rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.logo { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.6rem); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.logo span { color: var(--accent); }
.tag { color: #fff; font-size: 0.85rem; margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.money {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-family: var(--font-display); font-size: 1.1rem;
}
.mbot { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cards {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 6px;
  touch-action: pan-x; overscroll-behavior-x: contain; scrollbar-width: thin;
}
.card {
  flex: 0 0 min(74vw, 250px); scroll-snap-align: center; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  background: var(--panel); border: 2px solid var(--line); border-top: 5px solid var(--hc); border-radius: 14px; padding: 10px 12px 12px;
  cursor: pointer;
}
.card.sel { border-color: var(--accent); border-top-color: var(--hc); box-shadow: 0 0 0 2px rgba(255, 201, 51, .35); }
.card.look { border-color: rgba(255,255,255,.5); }
.chead { display: flex; align-items: center; gap: 10px; }
.chead svg { width: 40px; height: 52px; flex: none; }
.chead h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.chead p { margin: 0; color: var(--muted); font-size: 0.8rem; }
.card dl { margin: 0; display: grid; gap: 5px; font-size: 0.82rem; }
.card dt { color: var(--accent); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.card dd { margin: 0; }
.stats { font-size: 0.78rem; color: var(--muted); }
.act {
  margin-top: auto; width: 100%; padding: 10px; border-radius: 10px; border: 0; cursor: pointer;
  font-family: var(--font-display); font-size: 0.95rem; background: var(--accent); color: var(--on-accent);
}
.act.sec { background: rgba(255,255,255,.14); color: var(--fg); }
.act:disabled { opacity: 0.5; cursor: default; }
.go {
  width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
  font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em;
  background: var(--accent); color: var(--on-accent); box-shadow: 0 5px 0 #b98a00;
}
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a00; }
.go small { display: block; font-family: var(--font-body); font-size: 0.75rem; font-weight: 500; opacity: 0.8; letter-spacing: 0; }

/* ---------- Лобби ---------- */
#hud.lobby > .top, #hud.lobby > .btn { display: none; }
.slabels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.slabel {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap;
  font-family: var(--font-display); font-size: 0.95rem; padding: 3px 11px; border-radius: 999px;
  background: rgba(10, 16, 34, 0.72); border: 2px solid var(--hc, var(--line)); text-shadow: 0 2px 0 rgba(0,0,0,.6);
}
.slabel.nick { font-size: 0.78rem; padding: 2px 9px; border-width: 1px; border-color: rgba(255,255,255,.35); }
.slabel.nick.me { border-color: #ffc933; color: #ffe08a; }
#lobby { padding-block: 12px; }
#lobby > .mtop { pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lpanel {
  position: absolute; right: var(--gutter-r); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - var(--gutter) - var(--gutter-r)), 340px);
  background: var(--panel); border: 2px solid var(--line); border-top: 5px solid var(--hc, var(--accent)); border-radius: 14px;
  padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px;
}
.lpanel h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.lpanel p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.lpanel .lv { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9rem; }
.lpanel .lv b { font-family: var(--font-display); font-weight: 400; color: var(--accent); }
.lpanel .meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.lpanel .meter i { display: block; height: 100%; background: var(--hc, var(--accent)); }
.lpanel .act { margin-top: 4px; }
#heroOv { padding-block: 12px; }
.ddlg { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.ddlg h2 { margin: 0; }
.ddlg p { margin: 0; opacity: .85; }
.dgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.dgrid .act { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; }
.dgrid .act svg { width: 26px; height: 36px; flex: none; }
.dgrid .act.on { outline: 2px solid var(--accent); background: rgba(255,255,255,.22); }
.hdlg { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* ---------- Оверлеи ---------- */
.scrim { z-index: 6; display: grid; place-items: center; background: rgba(4, 8, 20, 0.66); pointer-events: auto; }
.scrim[hidden] { display: none; }
.dlg {
  width: min(100%, 360px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center;
}
.dlg h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.dlg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
.dlg li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dlg li b { font-family: var(--font-display); font-weight: 400; }
.dlg .act { margin-top: 4px; padding: 13px; }
#fail { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }

@media (prefers-reduced-motion: reduce) {
  #banner.show { animation: none; opacity: 1; }
}
</style>

<style>
:root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
<script>
/* iOS: зум отключён на всём экране — ни щипком, ни двойным тапом, ни кучей пальцев */
(function () {
  function locked(el) { for (; el && el.nodeType === 1 && el !== document.body && el !== document.documentElement; el = el.parentElement) if (getComputedStyle(el).touchAction === "none") return true; return false; }
  var lastEnd = 0, moved = false;
  document.addEventListener("touchstart", function (e) { moved = false; if (e.touches.length > 1 || locked(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) { moved = true; if (e.touches.length > 1 || e.scale && e.scale !== 1 || locked(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchend", function (e) {
    if (locked(e.target)) return;
    var now = Date.now();
    if (!moved && now - lastEnd < 400) {
      e.preventDefault(); // второй быстрый тап: не даём зумить, но клик делаем сами
      var t = e.target.closest && e.target.closest("button, a, label, input, select, textarea, summary, [role=tab], [role=button]");
      if (t && !t.disabled) { if (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) t.focus(); else t.click(); }
    }
    lastEnd = now;
  }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
})();
</script>
<script>document.addEventListener("gesturestart", function (e) { e.preventDefault(); });</script>

  }
  function advNextWave() { adv.waveI++; adv.queue = ROOMS[adv.room].waves[adv.waveI].slice(); adv.spawnT = adv.waveI ? 0.8 : 1.4; }
  function advSpawnPoint(type) {
    var R = adv.R;
    if (type === "pking") return { x: 0, z: -4 };
    var best = null;
    for (var t = 0; t < 12; t++) {
      var side = Math.floor(Math.random() * 3), u = rnd(-R + 2, R - 2), E = R - 1.5;
      var x = side === 0 ? -E : side === 1 ? E : u, z = side === 2 ? -E : (side < 2 ? rnd(-R + 2, R * 0.3) : u);
      var far = 99;
      if (player && !player.dead) far = Math.min(far, Math.hypot(x - player.pos.x, z - player.pos.z));
      if (adv.mate && !adv.mate.dead) far = Math.min(far, Math.hypot(x - adv.mate.pos.x, z - adv.mate.pos.z));
      best = { x: x, z: z };
      if (far > 9) break;
    }
    return best;
  }
  function advRoomClear() {
    var last = adv.room === ROOMS.length - 1, bonus = last ? 2500 : 120 + 80 * (adv.room - 1);
    advEvent({ k: "clear", b: bonus, w: last ? 1 : 0 });
    advOnClear(bonus, last);
  }
  function advOnClear(bonus, last) {
    if (adv.state !== "fight") return;
    adv.state = last ? "won" : "gate"; adv.cleared++;
    adv.earn += bonus;
    if (player && !player.dead) { player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.4); popText(player.pos.x, 3.6, player.pos.z, "+" + bonus, "#ffc933", true); }
    if (last) {
      var first = !save.pk;
      save.pk = (save.pk || 0) + 1;
      if (first) adv.earn += 3000;
      banner(TR("ПОБЕДА"), TR("Тыквенный король повержен!") + (first ? TR(" +3000 за первую победу") : ""));
      setTimeout(function () { if (adv && !adv.over) advResult(true); }, 2600);
    } else {
      openGate();
      banner(TR("Комната зачищена"), "+" + bonus + TR(" · дверь наверху открыта"));
    }
  }
  function advMateLeft() {
    if (!adv || adv.over) return;
    var name = adv.mate ? adv.mate.n : "";
    disposeMate(); adv.solo = true;
    if (!adv.host) {
      // хост ушёл: дальше врагов считаем сами
      adv.host = true;
      enemies.forEach(function (e) { if (e.proxy && !e.dead) { e.proxy = false; e.hp = Math.max(1, e.hpF * e.maxHp); } });
      if (adv.state === "fight") { adv.waveI = ROOMS[adv.room].waves.length - 1; adv.queue = []; }
    }
    banner(TR("Напарник ушёл"), (name ? name + " · " : "") + TR("дальше в одиночку"));
  }
  function advOnEvent(m) {
    if (!adv || adv.over) return;
    if (m.k === "room" && !adv.host) advBeginRoom(Math.max(0, Math.min(ROOMS.length - 1, m.i | 0)));
    else if (m.k === "ban") banner(TR(String(m.a || "")), TR(String(m.b || "")));
    else if (m.k === "clear") advOnClear(Math.max(0, Math.min(5000, +m.b || 0)), !!m.w);
    else if (m.k === "lose") advResult(false);
    else if (m.k === "ring") ringFx(+m.x || 0, +m.z || 0, Math.min(12, +m.r || 5), Math.min(2, +m.l || 0.4), m.c || 0xff6a2a, 0.9);
    else if (m.k === "warn") warnCircle(+m.x || 0, +m.z || 0, Math.min(12, +m.r || 5), Math.min(2, +m.l || 1));
    else if (m.k === "sh") shoot({ x: +m.x || 0, z: +m.z || 0, y: +m.y || 1.7, dx: +m.dx || 0, dz: +m.dz || 1, speed: Math.min(30, +m.s || 10), dmg: 0, life: Math.min(3, +m.l || 2), friendly: false, vis: true, color: m.c || 0xffffff, size: Math.min(1, +m.sz || 0.4), r: 0.4 });
  }
  function updateAdv(dt) {
    if (adv.over) return;
    tickRoom(dt);
    updateMate(dt);
    var m = adv.mate;
    if (m && !m.bot) {
      adv.sendT += dt;
      if (adv.sendT >= 0.1 && player) {
        adv.sendT = 0;
        var mv = Math.hypot(player.pos.x - adv.lx, player.pos.z - adv.lz) > 0.05 ? 1 : 0;
        adv.lx = player.pos.x; adv.lz = player.pos.z;
        netSend({ t: "ap", x: +player.pos.x.toFixed(2), z: +player.pos.z.toFixed(2), f: +player.face.toFixed(2), m: mv, hp: player.dead ? 0 : Math.max(1, Math.round(player.hp)), mh: player.maxHp, iv: player.invis > 0 ? 1 : 0 });
      }
    }
    if (!adv.host) { advUpdateProxies(dt); return; }
    if (m && !m.bot) { adv.snapT += dt; if (adv.snapT >= 0.1) { adv.snapT = 0; advSnap(); } }
    var D = ROOMS[adv.room];
    if (adv.state === "fight") {
      adv.spawnT -= dt;
      if (adv.queue.length && adv.spawnT <= 0 && aliveCount() < 8) {
        var ty = adv.queue.shift(), sp = advSpawnPoint(ty);
        spawnMon(ty, sp.x, sp.z, adv.nextId++);
        adv.spawnT = ty === "pking" ? 2 : 0.45;
      }
      if (!adv.queue.length && aliveCount() === 0) {
        if (adv.waveI < D.waves.length - 1) { advNextWave(); banner(TR("Ещё волна"), TR("Держитесь!")); advEvent({ k: "ban", a: "Ещё волна", b: "Держитесь!" }); }
        else advRoomClear();
      }
    } else if (adv.state === "gate") {
      var inG = function (o) { return Math.abs(o.pos.x) < 3.2 && o.pos.z < -adv.R + 3.4; };
      var pOk = player.dead || inG(player), mOk = !m || m.dead || inG(m);
      if (pOk && mOk && !(player.dead && (!m || m.dead))) advBeginRoom(adv.room + 1);
    }
    if (adv.state !== "won" && player.dead && (!m || m.dead)) { advEvent({ k: "lose" }); advResult(false); }
  }

  // ---------- старт, итог, выход ----------
  var RES_LABELS = Array.prototype.map.call($("resultOv").querySelectorAll("li span"), function (s) { return s.textContent; });
  var RES_IDS = ["resWave", "resKills", "resEarn", "resTotal"];
  function startAdv(m) {
    if (mode !== "lobby" || duel || adv) return;
    var def = HERO_BY_ID[advSel] || HERO_BY_ID[save.sel];
    heroOpen = false; $("heroOv").hidden = true; $("advOv").hidden = true; advQ = false;
    lobby.group.visible = false; $("slabels").hidden = true; $("lpanel").hidden = true; lobby.near = null;
    if (player) { disposeChar(player.c); player = null; }
    var myP = pwrMul(), mateP = m.o ? 1 + 0.1 * Math.max(0, Math.min(25, +m.o.p || 0)) : myP;
    adv = { host: m.s === 0, solo: !m.o && !m.bot, mateBot: !!m.bot, party: m.o || m.bot ? 2 : 1, mate: null, room: 0, floor: 1, R: 15, state: "fight", waveI: -1, queue: [],
      spawnT: 0, nextId: 1, sendT: 0, snapT: 0, earn: 0, cleared: 0, over: false, committed: false, started: false,
      pScale: 0.6 + 0.4 * (myP + mateP) / 2, lx: 0, lz: 0, gate: null };
    setRemotesVisible(false); dungeonLook(true);
    player = makePlayer(def);
    if (m.o) adv.mate = makeMate(m.o, HERO_BY_ID[m.o.h] || HERO_BY_ID.cobalt);
    else if (m.bot) adv.mate = makeBot();
    run = { wave: 1, state: "adv", timer: 0, queue: [], spawnT: 0, earn: 0, kills: 0, cap: 0, committed: true };
    mode = "play"; paused = false;
    input.jx = input.jy = 0; input.btnAtk = false; input.abil = false; input.keys = {};
    $("hName").textContent = def.name; $("abilLbl").textContent = def.abilName;
    $("quitBtn").textContent = TR("Покинуть подземелье");
    $("lobby").hidden = true; $("hud").hidden = false; $("hud").classList.remove("lobby"); $("resultOv").hidden = true; $("pauseOv").hidden = true;
    $("mateTxt").hidden = !adv.mate;
    resetJoy();
    advBeginRoom(0);
    banner("Halloween Adventure", adv.mate ? TR("Вместе с ") + adv.mate.n : TR("В одиночку. Удачи"));
    updateHud();
  }
  function commitAdv() {
    if (!adv || adv.committed) return;
    adv.committed = true;
    save.money += adv.earn;
    persist(); renderMoney();
  }
  function advResult(win) {
    if (!adv || adv.over) return;
    adv.over = true;
    commitAdv();
    mode = "dead"; deadT = 1e9; input.btnAtk = false; input.keys = {}; joyEnd();
    $("pauseOv").hidden = true;
    $("resTitle").textContent = win ? TR("Победа! Тыквенный король повержен") : TR("Подземелье оказалось сильнее");
    var rows = [[TR("Комнат пройдено"), adv.cleared + " / " + (ROOMS.length - 1)], [TR("Дошли до этажа"), String(adv.floor)], [TR("Заработано монет"), fmt(adv.earn)], [TR("Всего монет"), fmt(save.money)]];
    $("resultOv").querySelectorAll("li span").forEach(function (s, i) { s.textContent = rows[i][0]; });
    RES_IDS.forEach(function (id, i) { $(id).textContent = rows[i][1]; });
    $("resultOv").querySelector("ul").style.display = "";
    $("resBtn").textContent = ADV_OFFLINE ? TR("В лобби") : TR("Вернуться в комнату");
    $("hud").hidden = true; $("resultOv").hidden = false;
  }
  function cleanupAdv() {
    if (!adv) return;
    disposeMate();
    cleanupRun();
    disposeAdvRoom();
    adv = null;
    dungeonLook(false);
    $("mateTxt").hidden = true;
    $("resultOv").querySelectorAll("li span").forEach(function (s, i) { s.textContent = RES_LABELS[i]; });
    resetResultDlg();
  }
  function leaveAdv() {
    if (!adv) return;
    commitAdv();
    if (!ADV_OFFLINE) netSend({ t: "aend" });
    cleanupAdv();
    showLobby();
    setRemotesVisible(true);
    net.lx = 1e9; net.lm = -1;
    if (lobby.online && player) { player.pos.set(-14, 0, 7); player.face = Math.PI; snapCamera(); }
  }

  // ---------- окно выбора ----------
  function setAdvOpen(on) {
    heroOpen = on; $("advOv").hidden = !on;
    if (on) { input.keys = {}; joyEnd(); if (!advSel || save.owned.indexOf(advSel) < 0) advSel = save.sel; renderAdvUi(); }
    else { if (advQ) { advQ = false; netSend({ t: "aqc" }); } renderPanel(); }
  }
  function renderAdvUi() {
    var h = "";
    HEROES.forEach(function (d) {
      if (save.owned.indexOf(d.id) < 0) return;
      h += '<button class="act sec' + (advSel === d.id ? " on" : "") + '" data-id="' + d.id + '" type="button"' + (advQ ? " disabled" : "") + ">" + figSvg(d) + "<span>" + d.name + "</span></button>";
    });
    $("aHeroes").innerHTML = h;
    $("aStat").textContent = advQ ? TR("Ищем напарника… Пусть друг тоже нажмёт «Искать напарника».")
      : TR("3 этажа очень сильных монстров и Тыквенный король на третьем. Прокачка силы и радиуса работает. Вдвоём проще.") + (save.pk ? TR(" Король повержен: ") + save.pk : "");
    $("aGo").textContent = ADV_OFFLINE ? TR("С ботом-напарником") : advQ ? TR("Отмена") : TR("Искать напарника");
    $("aSolo").disabled = advQ;
  }
  $("aHeroes").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || advQ) return;
    advSel = b.getAttribute("data-id"); renderAdvUi();
  });
  $("aGo").addEventListener("click", function () {
    if (ADV_OFFLINE) { startAdv({ s: 0, o: null, bot: true }); return; }
    if (advQ) { advQ = false; netSend({ t: "aqc" }); }
    else { advQ = true; netSend({ t: "aq", id: advSel || save.sel, p: save.pwr }); }
    renderAdvUi();
  });
  $("aSolo").addEventListener("click", function () {
    if (ADV_OFFLINE) { startAdv({ s: 0, o: null }); return; }
    if (advQ) return;
    netSend({ t: "aq", id: advSel || save.sel, p: save.pwr, solo: 1 });
  });
  $("aClose").addEventListener("click", function () { setAdvOpen(false); });

  // станция в лобби: тёмная арка с тыквами
  (function buildAdvStation() {
    var where = Date.now() < ADV_UNTIL && !ADV_OFFLINE ? "online" : "never";
    var at = { x: -14, z: 12 };
    var st = lobbyStation({ id: "adv", where: where, x: at.x, z: at.z, r: 3.8, solid: 1.6, color: 0xff7a1a, label: TR("Хеллоуин"), labelY: 7 });
    var stone = lam(0x2e2838);
    [-2.2, 2.2].forEach(function (x) { part(BOX, stone, 0.9, 4.6, 0.9, x, 2.3, 0, st.group); });
    part(BOX, stone, 5.3, 0.9, 0.9, 0, 4.9, 0, st.group);
    var swM = new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
    var sw = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 4.4), swM); sw.position.set(0, 2.3, 0); st.group.add(sw);
    makePumpkin(-2.9, 1.1, 1.1, true, st.group); makePumpkin(2.9, 1.1, 0.9, true, st.group); makePumpkin(0, 0, 1.2, true, st.group).position.set(0, 5.35, 0);
    st.tick = function (t) { swM.opacity = 0.38 + Math.sin(t * 3) * 0.12; };
  })();

  if (window.__LG_TEST__) window.__lg = { adv: function () { return adv; }, enemies: function () { return enemies; }, player: function () { return player; }, save: function () { return save; },
    hurt: hurtEnemy, mode: function () { return mode; }, projs: function () { return projs; }, ROOMS: ROOMS, net: net };
  // ---------- главный цикл ----------
  var lastT = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = (now - lastT) / 1000; lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) return;
    resizeIfNeeded();
    if (!paused) {
      tAll += dt;
      if (mode === "lobby") {
        updateLobby(dt);
      } else if (mode === "play") {
        if (!(adv && player.dead)) updatePlayer(dt);
        if (mode === "play") updateRun(dt);
        for (var i = 0; i < enemies.length; i++) if (!enemies[i].dead && !enemies[i].duel && !enemies[i].proxy) updateMonster(enemies[i], dt);
        if (duel) updateDuel(dt);
        if (adv && mode === "play") updateAdv(dt);
        for (var j = enemies.length - 1; j >= 0; j--) if (enemies[j].dead) enemies.splice(j, 1);
        updateProjs(dt); updateFx(dt);
        if (player) updateHud();
      } else if (mode === "dead") {
        deadT -= dt; updateFx(dt);
        if (duel) updateDuel(dt);
        if (deadT <= 0 && !duel && $("resultOv").hidden) showResult();
      }
      updateParticles(dt); updatePops(dt);
    }
    updateCamera(paused ? 0.0001 : dt);
    if (mode === "lobby") updateLabels();
    renderer.render(scene, camera);
  }

  loadSave();
  window.addEventListener("resize", resizeIfNeeded);
  applyLobbyScene();
  showLobby();
  requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(loop); });
});
</script>
