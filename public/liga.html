<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Лига Улиц</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: во весь экран 3D-сцена. Поверх неё либо меню (герой крутится сверху, карточки героев внизу), либо HUD: джойстик слева, кнопки справа. Одна смелая деталь: жёлтый акцент и плакатный шрифт. */
:root {
  --font-display: "Russo One", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #0a1020;
  --panel: rgba(10, 16, 34, 0.86);
  --panel-solid: #121b38;
  --fg: #f1f5ff;
  --muted: #9fb0d4;
  --line: rgba(255, 255, 255, 0.16);
  --accent: #ffc933;
  --on-accent: #171200;
  --hp: #37d67a;
  --danger: #ff4a5c;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  position: relative;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

#stage { position: absolute; inset: 0; z-index: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#pops { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-display);
  font-size: 1rem;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
  white-space: nowrap;
  will-change: transform;
}
#hurt {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  box-shadow: inset 0 0 130px 30px rgba(255, 40, 60, 0.7);
  opacity: 0; transition: opacity 0.3s;
}
#hurt.on { opacity: 1; transition: none; }

.layer {
  position: absolute; inset: 0; z-index: 4;
  padding-left: var(--gutter);
  padding-right: var(--gutter-r);
  pointer-events: none;
}
.layer > * { pointer-events: auto; }

/* ---------- HUD ---------- */
#hud { display: flex; flex-direction: column; padding-block: 10px; }
#hud > .top { pointer-events: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.hpbox { width: min(44vw, 250px); min-width: 0; }
.hname { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.bar { height: 14px; border-radius: 7px; background: rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid var(--line); margin-top: 3px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--hp); transform-origin: left; transition: transform 0.12s, background 0.2s; }
.bar i.low { background: var(--danger); }
.hptxt { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.wave { text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.5); min-width: 0; }
.wave b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.wave span { font-size: 0.78rem; color: var(--muted); }
.right { display: flex; align-items: center; gap: 8px; }
.earn { font-family: var(--font-display); font-size: 1.05rem; display: flex; align-items: center; gap: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.coin { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #b98a00; display: inline-block; flex: none; }
.pbtn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(0, 0, 0, 0.45);
  font-family: var(--font-display); cursor: pointer;
}
#joyzone { position: absolute; left: 0; top: 64px; bottom: 0; width: 52%; touch-action: none; }
.joybase {
  position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07);
  pointer-events: none;
}
.joyknob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%; background: rgba(255,255,255,.42); border: 2px solid rgba(255,255,255,.7);
}
.btn {
  position: absolute; touch-action: none; border-radius: 50%; overflow: hidden; cursor: pointer;
  border: 3px solid rgba(255,255,255,.55); background: rgba(20, 28, 56, 0.55);
  font-family: var(--font-display); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6);
  display: grid; place-items: center; padding: 0; -webkit-tap-highlight-color: transparent;
}
.btn .lbl { position: relative; z-index: 1; font-size: 0.8rem; text-align: center; line-height: 1.05; padding: 0 6px; }
#btnAtk { width: 104px; height: 104px; right: calc(var(--gutter-r) + 4px); bottom: 26px; background: rgba(255, 201, 51, 0.3); border-color: var(--accent); }
#btnAtk .lbl { font-size: 1rem; }
#btnAbil { width: 80px; height: 80px; right: calc(var(--gutter-r) + 122px); bottom: 40px; }
#btnAbil.ready { border-color: #5df0ff; box-shadow: 0 0 18px rgba(93, 240, 255, 0.7); }
.cdfill { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); transform-origin: bottom; transform: scaleY(0); }
.btn:active { filter: brightness(1.25); }

#banner {
  position: absolute; left: 0; right: 0; top: 22%; z-index: 5; text-align: center; pointer-events: none;
  opacity: 0; padding: 0 16px;
}
#banner b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 9vw, 4rem); text-shadow: 0 4px 0 rgba(0,0,0,.55); text-wrap: balance; }
#banner span { display: block; font-size: 1rem; color: var(--accent); margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
#banner.show { animation: ban 2.2s ease forwards; }
@keyframes ban {
  0% { opacity: 0; transform: scale(0.8); }
  14% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-8px); }
}

/* ---------- Меню ---------- */
#menu { display: flex; flex-direction: column; justify-content: space-between; padding-block: 12px; }
#menu > .mtop { pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.back { display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 999px; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); color: #fff; font-size: 0.8rem; font-weight: 700; text-decoration: none; }
.who { margin-left: 8px; font-size: 0.8rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.logo { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.6rem); line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.logo span { color: var(--accent); }
.tag { color: #fff; font-size: 0.85rem; margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.money {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-family: var(--font-display); font-size: 1.1rem;
}
.mbot { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cards {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 6px;
  touch-action: pan-x; overscroll-behavior-x: contain; scrollbar-width: thin;
}
.card {
  flex: 0 0 min(74vw, 250px); scroll-snap-align: center; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  background: var(--panel); border: 2px solid var(--line); border-top: 5px solid var(--hc); border-radius: 14px; padding: 10px 12px 12px;
  cursor: pointer;
}
.card.sel { border-color: var(--accent); border-top-color: var(--hc); box-shadow: 0 0 0 2px rgba(255, 201, 51, .35); }
.card.look { border-color: rgba(255,255,255,.5); }
.chead { display: flex; align-items: center; gap: 10px; }
.chead svg { width: 40px; height: 52px; flex: none; }
.chead h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.chead p { margin: 0; color: var(--muted); font-size: 0.8rem; }
.card dl { margin: 0; display: grid; gap: 5px; font-size: 0.82rem; }
.card dt { color: var(--accent); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.card dd { margin: 0; }
.stats { font-size: 0.78rem; color: var(--muted); }
.act {
  margin-top: auto; width: 100%; padding: 10px; border-radius: 10px; border: 0; cursor: pointer;
  font-family: var(--font-display); font-size: 0.95rem; background: var(--accent); color: var(--on-accent);
}
.act.sec { background: rgba(255,255,255,.14); color: var(--fg); }
.act:disabled { opacity: 0.5; cursor: default; }
.go {
  width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
  font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em;
  background: var(--accent); color: var(--on-accent); box-shadow: 0 5px 0 #b98a00;
}
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a00; }
.go small { display: block; font-family: var(--font-body); font-size: 0.75rem; font-weight: 500; opacity: 0.8; letter-spacing: 0; }

/* ---------- Лобби ---------- */
#hud.lobby > .top, #hud.lobby > .btn { display: none; }
.slabels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.slabel {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap;
  font-family: var(--font-display); font-size: 0.95rem; padding: 3px 11px; border-radius: 999px;
  background: rgba(10, 16, 34, 0.72); border: 2px solid var(--hc, var(--line)); text-shadow: 0 2px 0 rgba(0,0,0,.6);
}
.slabel.nick { font-size: 0.78rem; padding: 2px 9px; border-width: 1px; border-color: rgba(255,255,255,.35); }
.slabel.nick.me { border-color: #ffc933; color: #ffe08a; }
#lobby { padding-block: 12px; }
#lobby > .mtop { pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lpanel {
  position: absolute; right: var(--gutter-r); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - var(--gutter) - var(--gutter-r)), 340px);
  background: var(--panel); border: 2px solid var(--line); border-top: 5px solid var(--hc, var(--accent)); border-radius: 14px;
  padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px;
}
.lpanel h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.lpanel p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.lpanel .lv { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9rem; }
.lpanel .lv b { font-family: var(--font-display); font-weight: 400; color: var(--accent); }
.lpanel .meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.lpanel .meter i { display: block; height: 100%; background: var(--hc, var(--accent)); }
.lpanel .act { margin-top: 4px; }
#heroOv { padding-block: 12px; }
.hdlg { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* ---------- Оверлеи ---------- */
.scrim { z-index: 6; display: grid; place-items: center; background: rgba(4, 8, 20, 0.66); pointer-events: auto; }
.scrim[hidden] { display: none; }
.dlg {
  width: min(100%, 360px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center;
}
.dlg h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.dlg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
.dlg li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dlg li b { font-family: var(--font-display); font-weight: 400; }
.dlg .act { margin-top: 4px; padding: 13px; }
#fail { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }

@media (prefers-reduced-motion: reduce) {
  #banner.show { animation: none; opacity: 1; }
}
</style>

<style>
:root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
<script>document.addEventListener("gesturestart", function (e) { e.preventDefault(); });</script>
</head>
<body>
<div id="stage"></div>
<div id="pops"></div>
<div id="hurt"></div>

<div class="layer" id="hud" hidden>
  <div class="top">
    <div class="hpbox">
      <div class="hname" id="hName">Герой</div>
      <div class="bar"><i id="hpFill"></i></div>
      <div class="hptxt mono" id="hpTxt"></div>
    </div>
    <div class="wave"><b id="waveEl">Волна 1</b><span id="foeEl"></span></div>
    <div class="right">
      <div class="earn"><span class="mono" id="earnEl">0</span><span class="coin"></span></div>
      <button class="pbtn" id="pauseBtn" type="button" aria-label="Пауза">II</button>
    </div>
  </div>
  <div id="joyzone"><div class="joybase" id="joyBase"><div class="joyknob" id="joyKnob"></div></div></div>
  <button class="btn" id="btnAbil" type="button"><span class="lbl" id="abilLbl">Способность</span><i class="cdfill" id="cdFill"></i></button>
  <button class="btn" id="btnAtk" type="button"><span class="lbl">УДАР</span></button>
</div>

<div id="banner"><b id="banMain"></b><span id="banSub"></span></div>

<div class="slabels" id="slabels"></div>

<div class="layer" id="lobby">
  <div class="mtop">
    <div>
      <a class="back" href="./">← Claudix</a><span class="who" id="who"></span> <span class="cx-lang-slot"></span>
      <h1 class="logo">ЛИГА <span>УЛИЦ</span></h1>
      <div class="tag">Качай героя и прыгай в портал.</div>
    </div>
    <div class="money"><span class="mono" id="moneyEl">0</span><span class="coin"></span></div>
  </div>
  <div class="lpanel" id="lpanel" hidden>

  </div>
</div>

<div class="layer scrim" id="heroOv" hidden>

  </div>
</div>

<div class="layer scrim" id="pauseOv" hidden>
  <div class="dlg">
    <h2>Пауза</h2>
    <button class="act" id="resumeBtn" type="button">Продолжить</button>

  </div>
</div>

<div class="layer scrim" id="resultOv" hidden>

    <h2 id="resTitle">Герой пал</h2>
    <ul>
      <li><span>Дошёл до волны</span><b class="mono" id="resWave">0</b></li>
      <li><span>Побеждено врагов</span><b class="mono" id="resKills">0</b></li>
      <li><span>Заработано монет</span><b class="mono" id="resEarn">0</b></li>
      <li><span>Всего монет</span><b class="mono" id="resTotal">0</b></li>
    </ul>
    <button class="act" id="resBtn" type="button">В меню</button>
  </div>
</div>

<div id="fail" hidden><div>Не удалось запустить 3D. Открой страницу в обычном браузере с включённым WebGL и интернетом.</div></div>

<script>/*i18n*/

  if (typeof THREE === "undefined") { $("fail").hidden = false; return; }

      role: TR("Повелитель молний"), atk: TR("Молния бьёт врага и перескакивает ещё на двоих"), abil: TR("Гроза: молнии с неба по всем вокруг и оглушение"), abilName: TR("Гроза") },
    { id: "shade", name: TR("Тень-9"), price: 1200, suit: 0x2b2540, accent: 0x9b6bff, skin: 0xc9936c, hp: 85, speed: 8.6, cd: 8, atkCd: 0.26,

  requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(loop); });
});
</script>
